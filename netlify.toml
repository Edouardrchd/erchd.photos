# Le site est construit par Astro, qui genere des fichiers statiques dans dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Les photos ne changent que si on les remplace : une semaine de cache cote
# navigateur. index.html reste toujours revalide pour que les modifications
# soient visibles tout de suite.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro ajoute une empreinte au nom des fichiers de /_astro : ils peuvent etre
# gardes en cache indefiniment sans risque.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
