# Site statique : aucun build, on publie le dossier tel quel.
[build]
  publish = "."
  command = ""

# Les photos et icones ne changent que si on les remplace : on les met en cache
# une semaine cote navigateur. index.html, lui, reste toujours revalide pour que
# les modifications soient visibles immediatement.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
