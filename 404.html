<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable — Edouard Richard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0B0C;color:#EDEAE3;font-family:'Jost',sans-serif;font-weight:300;
  min-height:100svh;display:flex;align-items:center;justify-content:center;padding:8vw;text-align:center}
p.tag{font-family:'IBM Plex Mono',monospace;font-size:.625rem;letter-spacing:.22em;text-transform:uppercase;color:#C4472C}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(2.5rem,9vw,6rem);line-height:.9;margin:1rem 0 1.5rem}
p.txt{color:#9C9A93;max-width:40ch;margin:0 auto 2rem}
a{display:inline-block;color:#EDEAE3;text-decoration:none;border:1px solid #33373A;padding:.9rem 2rem;
  font-family:'IBM Plex Mono',monospace;font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;
  transition:background .35s,color .35s}
a:hover{background:#EDEAE3;color:#0A0B0C}
</style>
</head>
<body>
<div>
  <p class="tag">Erreur 404</p>
  <h1>Cette page<br>n'existe pas</h1>
  <p class="txt">Le lien est peut-être ancien, ou la page a été déplacée.</p>
  <a href="/">Retour au portfolio</a>
</div>
</body>
</html>
