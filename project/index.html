<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio de photographie sportive : football, basketball, handball et boxe." />
    <title>Photographie Sportive</title>
  </head>
  <body>
    <div id="app"></div>

    <!--
      Formulaire statique detecte par Netlify Forms au moment du deploiement.
      Il est masque : c'est le formulaire de src/views/Contact.vue que le
      visiteur remplit, mais Netlify a besoin de voir cette version dans le HTML
      livre pour enregistrer les messages.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
